context:
  version: "3.7c"

package:
  name: tmux
  version: ${{ version }}_

source:
  url: https://github.com/tmux/tmux/archive/${{ version }}.tar.gz
  sha256: 5e7b0f533b66e5633e2b72a9d483f9534a343ab7011eb2621b6309dfba553daa

build:
  number: 0
  skip:
    - win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - autoconf
    - automake
    - libtool
    - m4
    - make
    - patch
    - pkg-config
    - bison
    - if: unix
      then:
        - gnuconfig
  host:
    - libevent
    - ncurses
    - if: osx
      then:
        - libutf8proc
        - jemalloc
  run:
    - libevent
    - ncurses

tests:
  - script:
      - tmux -V

about:
  homepage: https://tmux.github.io/
  license: ISC
  license_file: COPYING
  summary: A terminal multiplexer.

extra:
  recipe-maintainers:
    - XhstormR
    - jakirkham
    - djsutherland
    - dbast
    - matthiasdiener
    - seowalex
